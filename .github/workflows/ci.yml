name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm --filter @workspace/api-server run test
      - run: pnpm --filter @workspace/api-server run test:coverage
      - run: pnpm run typecheck
      - name: Build frontend
        run: pnpm --filter @workspace/landmate run build
        env:
          PORT: 4173
          BASE_PATH: /
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Scan tracked source for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --redact --no-banner
      - name: Build API container
        run: docker build -f artifacts/api-server/Dockerfile -t landmate-api .
      - name: Build frontend container
        run: docker build -f artifacts/landmate/Dockerfile -t landmate-web .

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
